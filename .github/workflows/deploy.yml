# Workflow simples para fazer deploy de projetos Vite/React no GitHub Pages
name: Deploy to GitHub Pages

on:
  # Executa sempre que houver push na branch main
  push:
    branches: ['main']

  # Permite executar manualmente pela aba Actions do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que não teremos deploys concorrentes
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalando dependências
        run: npm install

      - name: Executando o Build (Vite)
        run: npm run build

      - name: Preparando Pages
        uses: actions/configure-pages@v4

      - name: Upload dos artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          # O Vite salva o build final na pasta dist
          path: './dist'

      - name: Publicando no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
